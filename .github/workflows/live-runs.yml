name: Live runs

# Verified live runs (issue #8): scripts/live_smoke.py, run for real.
#
# workflow_dispatch ONLY -- never push, never pull_request. Every other
# workflow in this repo (ci.yml, publish.yml's "test"/"build" jobs) is
# offline; this is the one workflow that sends real prompts to a real
# Anthropic model and so is the one workflow that spends real money. It
# must never fire on its own from routine repo activity.
#
# Secret mapping: the repo secret is named CLAUDE_API_KEY (not
# ANTHROPIC_API_KEY) -- every SDK path this project's adapters route
# through reads the ANTHROPIC_API_KEY environment variable specifically
# (the `anthropic` client, `litellm`, `langchain-anthropic`, and
# `autogen_ext`'s AnthropicChatCompletionClient were all checked directly --
# see docs/demo-runs.md, "Live runs"), so this workflow maps
# ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }} on the one step that
# needs it, rather than renaming the secret or hoping every SDK reads
# CLAUDE_API_KEY (none of them do).
#
# Guard pattern: detect-in-a-step, not a job-level `env:` condition --
# copied deliberately from publish.yml's own PYPI_API_TOKEN detection,
# which exists because a job-level env condition on a secret silently
# evaluated false there. A secret is only guaranteed visible inside a
# step's own `env:`/`run:`, so detection happens in a dedicated first step
# and every later step gates on that step's *output*, never on
# `secrets.CLAUDE_API_KEY` directly in an `if:`.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated subset of targets to run (google-adk, openai,
          claude, crewai, autogen, langgraph)
        required: false
        default: "google-adk,openai,claude,crewai,autogen,langgraph"
      model:
        description: "Anthropic model id to use for every target"
        required: false
        default: "claude-haiku-4-5"
        type: choice
        options:
          - claude-haiku-4-5
          - claude-sonnet-5
          - claude-opus-5
      dry_run:
        description: >-
          Build every target's entry agent but make no real model call
          (no cost) -- use this to test the workflow itself
        required: false
        default: false
        type: boolean

jobs:
  live-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # See the header comment: detection happens in its own step, with the
      # secret only in THIS step's env, so its presence is checked without
      # ever leaking the value and without relying on a job-level `if:`
      # against `secrets.*` (which is not guaranteed to evaluate as
      # expected -- see publish.yml's PYPI_API_TOKEN detection step for the
      # prior incident this pattern exists to avoid).
      - name: Detect CLAUDE_API_KEY secret
        id: detect
        if: ${{ !inputs.dry_run }}
        env:
          KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "CLAUDE_API_KEY is set (${#KEY} chars) -- proceeding with live runs."
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CLAUDE_API_KEY secret is not set (or not visible to this job)." \
                 "Add it under Settings > Secrets and variables > Actions before" \
                 "running this workflow, or re-run with dry_run: true to test the" \
                 "workflow itself without a key."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail loudly if CLAUDE_API_KEY is missing
        if: ${{ !inputs.dry_run && steps.detect.outputs.has_key != 'true' }}
        run: |
          echo "::error::No usable CLAUDE_API_KEY secret -- refusing to run scripts/live_smoke.py (it would fail loudly itself, but there is no point installing every SDK extra first)."
          exit 1

      - name: Install commonadk (dev + every extra)
        run: pip install -e ".[dev,google,openai,claude,crewai,autogen,langgraph]"

      - name: Run scripts/live_smoke.py
        id: run
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          args=(--targets "${{ inputs.targets }}" --model "${{ inputs.model }}" --out-dir live_smoke_out)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/live_smoke.py "${args[@]}"

      - name: Write summary table to the job summary
        if: always()
        run: |
          {
            echo "## Live run summary"
            echo
            if [ -f live_smoke_out/live_smoke_report.json ]; then
              python3 - <<'PY'
          import json

          with open("live_smoke_out/live_smoke_report.json") as f:
              data = json.load(f)

          print(f"- **model**: `{data['model']}`")
          print(f"- **dry run**: `{data['dry_run']}`")
          print(f"- **prompt**: `{data['prompt']}`")
          summary = data["summary"]
          print(f"- **result**: {summary['succeeded']}/{summary['total']} succeeded, {summary['failed']} failed")
          print()
          print("| target | status | wall (s) | tokens | cost (USD) | error |")
          print("|---|---|---:|---:|---:|---|")
          for r in data["results"]:
              usage = r["usage"]
              if isinstance(usage, dict):
                  tokens = usage.get("total_tokens")
                  tokens = "?" if tokens is None else tokens
                  cost = usage.get("cost_usd")
                  cost = "?" if cost is None else f"{cost:.6f}"
              elif usage is None:
                  tokens = cost = "-"
              else:
                  # "unavailable" (no runner for this target) or
                  # "not_called (dry run)" -- printed verbatim, never
                  # coerced into a number that could look like real data.
                  tokens = cost = str(usage)
              error = (r.get("error") or "").replace("|", "\\|")
              print(f"| {r['target']} | {r['status']} | {r['wall_time_s']:.2f} | {tokens} | {cost} | {error} |")
          PY
            else
              echo "_scripts/live_smoke.py did not write a report -- it likely failed before" \
                   "reaching any target (see the job log above, e.g. a missing" \
                   "CLAUDE_API_KEY or a project-load failure)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report
          path: |
            live_smoke_out/live_smoke_report.json
            live_smoke_out/*-trace.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the job if the live run failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::scripts/live_smoke.py exited non-zero -- see the summary and uploaded report above for per-target detail."
          exit 1
