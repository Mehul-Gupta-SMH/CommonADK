name: Publish

# Tag-triggered release to PyPI via Trusted Publishing (issue #7) -- no
# tokens or secrets: the "publish" job authenticates to PyPI purely via the
# short-lived OIDC token minted from `permissions: id-token: write`, scoped
# to the "pypi" environment. Push a tag "vX.Y.Z" matching pyproject.toml's
# `version` to release.

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install commonadk (core + dev)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python3 -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard -- tag must match pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pyproject.toml version $PYPROJECT_VERSION -- continuing."

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python3 -m build

      - name: Check distributions
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/commonadk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
