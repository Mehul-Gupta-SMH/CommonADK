[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commonadk"
version = "0.1.0"
description = "Define an agent system once, in a framework-neutral format, and materialize it into any agent SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Mehul Gupta", email = "mehulgupta85@gmail.com" },
]
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
commonadk = "commonadk.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
google = [
    "google-adk",
    # google-adk's own LiteLlm wrapper (google.adk.models.lite_llm) only
    # checks `importlib.util.find_spec("litellm")` -- it does NOT need
    # google-adk's "extensions" extra, which pulls in a large, unrelated
    # bundle (crewai, langgraph, llama-index, chromadb, ...). Depending on
    # the standalone `litellm` package directly is required so non-gemini
    # models (plan.md model routing) can be wrapped with LiteLlm.
    "litellm",
]
openai = [
    "openai-agents[litellm]",
]
claude = [
    # Anthropic-native only -- no LiteLLM path for this target (see
    # adapters/claude_agent.py's module docstring), so no litellm dependency.
    "claude-agent-sdk",
]
crewai = [
    # crewai's own `LLM` class routes known providers to a native client and
    # falls back to litellm's `completion()` for everything else (see
    # adapters/crewai_adapter.py's module docstring, "Model routing") -- the
    # `litellm` extra is what makes that fallback path actually work instead
    # of raising ImportError for an unrecognized provider.
    "crewai[litellm]",
]
autogen = [
    # Microsoft's current AutoGen stack (autogen-agentchat/-core/-ext,
    # 0.4+) -- NOT the community `ag2` fork, which has an unrelated API
    # (see adapters/autogen_adapter.py's module docstring). The `openai`
    # extra ships the native OpenAI model client used for the `openai/...`
    # provider AND, via its own built-in model-name special-casing, the
    # `gemini/...` provider (see module docstring, "Model routing"); the
    # `anthropic` extra ships the separate native client used for
    # `anthropic/...`. No version pin was needed to keep the other extras'
    # test suites green -- see that same docstring's closing note, and this
    # project's full-suite run notes, for the one observed (harmless)
    # dependency wrinkle: autogen-core pins protobuf~=5.29, which downgrades
    # protobuf from the newer version google-adk's own dependencies want.
    # No installed code path this project's tests exercise is affected.
    "autogen-agentchat",
    "autogen-ext[openai,anthropic]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commonadk"]
