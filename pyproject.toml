[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commonadk"
version = "0.0.2"
description = "Define an agent system once, in a framework-neutral format, and materialize it into any agent SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Mehul Gupta", email = "mehulgupta85@gmail.com" },
]
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
commonadk = "commonadk.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
google = [
    "google-adk",
    # google-adk's own LiteLlm wrapper (google.adk.models.lite_llm) only
    # checks `importlib.util.find_spec("litellm")` -- it does NOT need
    # google-adk's "extensions" extra, which pulls in a large, unrelated
    # bundle (crewai, langgraph, llama-index, chromadb, ...). Depending on
    # the standalone `litellm` package directly is required so non-gemini
    # models (plan.md model routing) can be wrapped with LiteLlm.
    "litellm",
]
openai = [
    "openai-agents[litellm]",
]
claude = [
    # Anthropic-native only -- no LiteLLM path for this target (see
    # adapters/claude_agent.py's module docstring), so no litellm dependency.
    "claude-agent-sdk",
]
crewai = [
    # crewai's own `LLM` class routes known providers to a native client and
    # falls back to litellm's `completion()` for everything else (see
    # adapters/crewai_adapter.py's module docstring, "Model routing") -- the
    # `litellm` extra is what makes that fallback path actually work instead
    # of raising ImportError for an unrecognized provider.
    #
    # `google-genai` and `anthropic` are the NATIVE side of that same routing
    # decision, and are required, not optional. crewai recognizes `gemini/...`
    # and `anthropic/...` as known providers and takes its native client path
    # for them -- litellm never sees those calls, so the `litellm` extra alone
    # does not cover them. Without these, building any agent on a gemini model
    # raises ImportError from crewai/llms/providers/gemini/completion.py
    # ('Google Gen AI native provider not available'), which is exactly what
    # the shipped research-crew example uses, and anthropic is what every live
    # smoke run uses.
    #
    # This was masked locally and in the all-extras CI job, where the `google`
    # extra happens to pull `google-genai` in transitively via google-adk; only
    # the crewai-only matrix leg installs crewai without it, which is precisely
    # what that leg exists to catch.
    "crewai[litellm,google-genai,anthropic]",
]
autogen = [
    # Microsoft's current AutoGen stack (autogen-agentchat/-core/-ext,
    # 0.4+) -- NOT the community `ag2` fork, which has an unrelated API
    # (see adapters/autogen_adapter.py's module docstring). The `openai`
    # extra ships the native OpenAI model client used for the `openai/...`
    # provider AND, via its own built-in model-name special-casing, the
    # `gemini/...` provider (see module docstring, "Model routing"); the
    # `anthropic` extra ships the separate native client used for
    # `anthropic/...`. No version pin was needed to keep the other extras'
    # test suites green -- see that same docstring's closing note, and this
    # project's full-suite run notes, for the one observed (harmless)
    # dependency wrinkle: autogen-core pins protobuf~=5.29, which downgrades
    # protobuf from the newer version google-adk's own dependencies want.
    # No installed code path this project's tests exercise is affected.
    # Re-verified 2026-09-11 (issue #12 dependency-pin watch): a real
    # `pip install -e ".[google,openai,claude,crewai,autogen,langgraph,dev]"`
    # still resolves (dry-run exits 0, no ResolutionImpossible); `pip check`
    # against the resulting env (protobuf 5.29.6, satisfying this pin) shows
    # only this same protobuf tension plus the openai-agents-wants->=3-but-
    # crewai-pins-<3 tension already documented in the `langgraph` extra's
    # comment below -- nothing new, nothing broken. Full 259-test suite
    # still green.
    "autogen-agentchat",
    "autogen-ext[openai,anthropic]",
    # `anthropic<1` -- REQUIRED, not a style choice. Verified live (M8 first
    # live run, all six targets, model anthropic/claude-haiku-4-5): AutoGen's
    # native Anthropic client (autogen_ext.models.anthropic._anthropic_client,
    # still true as of autogen-ext 0.7.5) unconditionally injects
    # `"temperature": create_args.get("temperature", 1.0)` into EVERY
    # Anthropic request it builds, even when the caller passes no
    # `model_params` at all -- there is no commonadk-side way to suppress
    # this, it happens inside autogen_ext's own `create`/`create_stream`
    # (see autogen_adapter.py's module docstring for the full citation).
    # `anthropic>=1` (confirmed: the 0.125.0 -> 1.0.0 jump, still true at
    # 1.5.0, both checked directly against the installed
    # `AsyncMessages.create` signature) removed the `temperature` parameter
    # from `messages.create()`/`AsyncMessages.create()` entirely, so that
    # hard-coded kwarg becomes `TypeError: AsyncMessages.create() got an
    # unexpected keyword argument 'temperature'` on every Anthropic-routed
    # call -- reproduced directly in a clean venv with
    # `anthropic>=1 autogen-ext[anthropic]==0.7.5` installed, no network
    # call needed (the TypeError fires at Python argument-binding time,
    # before any HTTP request). This is why the `autogen` extra's own CI
    # leg (`pip install -e ".[dev,autogen]"`, no other extra installed to
    # pull in an older transitive `anthropic` pin) resolved anthropic 1.5.0
    # and the M8 live run failed in 0.22s, never reaching the API. Checked
    # this pin doesn't fight any other extra's own `anthropic` constraint:
    # `claude-agent-sdk` (the `claude` extra) does not depend on the
    # `anthropic` PyPI package at all (it talks to the Claude Code CLI, not
    # the Anthropic Python SDK -- confirmed via its wheel's own
    # Requires-Dist, which never mentions `anthropic`); `langchain-anthropic`
    # (the `langgraph` extra) requires `anthropic<2.0.0,>=0.120.0`, which
    # `anthropic<1` sits comfortably inside; plain `litellm` (the `google`/
    # `openai`/`crewai` extras' shared dependency) does not require the
    # `anthropic` package at all outside its own unused `proxy-runtime`
    # extra. A real `pip install -e ".[google,openai,claude,crewai,autogen,
    # langgraph,dev]"` with this pin in place resolves cleanly to
    # anthropic==0.125.0 with `pip check` reporting no broken requirements.
    # Re-verified 2026-09-11 (issue #12 dependency-pin watch) against the
    # currently installed anthropic==0.122.0 and autogen-ext==0.7.5: still
    # <1, `AsyncMessages.create`'s signature still accepts `temperature`
    # (checked via `inspect.signature`, not memory), and
    # `_check_anthropic_temperature_compat()` still finds the pin honored.
    # This pin AVOIDS the upstream bug (autogen_ext still hard-codes the
    # kwarg; it is not fixed), it does not fix it -- see
    # autogen_adapter.py's module docstring for the runtime guard that
    # protects an environment where something else upgrades `anthropic`
    # past this pin after install.
    "anthropic<1",
]
langgraph = [
    # LangGraph itself (prebuilt agent nodes, StateGraph, the Command
    # primitive this adapter's handoff tools use) plus langchain's
    # provider-routing model-loading facade (`langchain.chat_models.
    # init_chat_model`, "provider:model" strings, and its current
    # `langchain.agents.create_agent` -- see adapters/langgraph_adapter.py's
    # module docstring for why `langgraph.prebuilt.create_react_agent` is
    # NOT used: it is deprecated in favor of `create_agent` in this
    # installed stack). No `langgraph-supervisor`/`langgraph-swarm` --
    # deliberately not needed, see that same docstring's "Handoff
    # mechanism".
    "langgraph",
    "langchain",
    # One langchain integration package per LiteLLM provider this adapter
    # ships a native path for (see module docstring, "Model routing"):
    # gemini/* -> google_genai, openai/* -> openai, anthropic/* ->
    # anthropic. No litellm fallback -- unsupported providers are a clear
    # build-time error, matching the AutoGen and Claude Agent SDK adapters'
    # policy rather than CrewAI's. No version pin was needed to keep every
    # other extra's test suite green -- this extra's install resolved
    # cleanly against every package already pinned by google/openai/claude/
    # crewai/autogen (verified: `pip check`'s only findings after
    # installing this extra are the same pre-existing, harmless tensions
    # already noted in the `autogen` extra above and in this project's full-
    # suite run notes -- openai-agents wanting openai>=3 while crewai pins
    # it to 2.x, and protobuf being held to 5.29 by autogen-core/google-adk
    # transitively -- nothing this extra's own code paths touch).
    "langchain-google-genai",
    "langchain-openai",
    "langchain-anthropic",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commonadk"]
