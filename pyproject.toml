[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commonadk"
version = "0.1.0"
description = "Define an agent system once, in a framework-neutral format, and materialize it into any agent SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Mehul Gupta", email = "mehulgupta85@gmail.com" },
]
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commonadk"]
